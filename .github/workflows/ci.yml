name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `node --test "glob"` only globs on >=21 -- on 20 the
          # pattern is a literal filename and every suite "Could not find".
          node-version: 22
      - name: install
        run: npm install
      - name: build
        run: npm run build --if-present
      - name: tests
        # Gated on shipped test FILES matching what runners actually execute:
        # awsh's mirror ships a test/ dir but not the *.test.ts files its own
        # `npm test` globs, so a bare directory gate still runs a command that
        # can only fail.
        if: ${{ hashFiles('test/**/*.test.*', 'tests/**/*.test.*') != '' }}
        run: npm test
